version: "3.9"

services:
  odoo-sync:
    build: .
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      HOST: 0.0.0.0
      LOG_LEVEL: info
      MIDDLEWARE_SECRET_KEY: your_secret_key_here_min_32_chars
      DB_PATH: ./data/middleware.db
      ODOO_READ_BATCH_SIZE: 4000
      ODOO_SEARCH_READ_BATCH_SIZE: 4000
      ODOO_READ_CONCURRENCY: 2
      ODOO_RPC_TIMEOUT_MS: 120000
      ODOO_WRITE_DATE_WINDOW_MINUTES: 60
      ODOO_INCREMENTAL_TARGET_MODE: ids
      ODOO_RES_PARTNER_FIELDS: name,email,vat,ref,company_id,street,street2,zip,city,country_id,state_id,phone,mobile,active
    volumes:
      - ./data:/app/data
    restart: unless-stopped
